<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bawayi Dental Clinic</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* شینی کاڵ بۆ پاشبنەمای گشتی دەرەوەی وەرقەکە */
        body { 
            background-color: #e3f2fd; 
            margin: 0; 
            padding: 15px; 
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .top-nav {
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 10px;
        }

        /* دوگمەی نوێکردنەوەی پەڕە - زەرد */
        .refresh-btn {
            background-color: #ffeb3b;
            color: black;
            border: 1px solid #fbc02d;
            padding: 8px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .refresh-btn:hover { background-color: #fdd835; }

        /* وەرقە ڕەشەکە ڕێک وەک مۆنیتەری کلینیکەکە */
        .report-paper {
            width: 100%;
            max-width: 850px;
            background-color: #000000;
            color: #ffffff;
            padding: 40px 25px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #333;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* بەشی زانیاری سەرەوە - تەنها تاریخ و ناوی نەخۆش */
        .header-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #aaa;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .main-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .main-title h1 {
            color: #2196f3;
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }

        .main-title p {
            color: #ccc;
            font-size: 14px;
            margin: 6px 0 0 0;
        }

        /* بەشی دوگمە سەرەکییەکان */
        .action-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .btn {
            padding: 18px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            color: white;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        /* بارکردنی تیشک PDF - سوور و تۆزێک گەورەتر */
        .btn-red { background-color: #f44336; flex: 1.2; }
        .btn-red:hover { background-color: #d32f2f; }

        /* ئەنجامی PDF - سەوز */
        .btn-green { background-color: #4caf50; flex: 1; }
        .btn-green:hover { background-color: #388e3c; }

        /* نیشاندانی وێنەکان لەسەر لاپەڕەکە بە چوار چوار */
        #image-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .img-box {
            border: 1px solid #333;
            background: #0a0a0a;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 4px;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .footer-credit {
            text-align: center;
            font-size: 11px;
            color: #444;
            margin-top: 40px;
            border-top: 1px solid #111;
            padding-top: 15px;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="refresh-btn" onclick="window.location.reload()">نوێ کردنەوەی پەڕە</button>
    </div>

    <div class="report-paper">
        <div class="header-info">
            <div id="pdf-date">Date: --/--/----</div>
            <div id="pdf-patient">Patient Name: ...</div>
        </div>

        <div class="main-title">
            <h1>عيادة باوابي</h1>
            <p>لاشعة الاسنان والوجه والفكين</p>
        </div>

        <div class="action-area">
            <label for="file-input" class="btn btn-red">بارکردنی تیشک PDF</label>
            <input type="file" id="file-input" multiple>
            
            <button class="btn btn-green" onclick="generatePDF()">ئەنجامی PDF</button>
        </div>

        <div id="image-grid"></div>

        <div class="footer-credit">Developed by: Mohammed Ezzadin</div>
    </div>

<script>
    let imagesData = [];
    let currentPatientName = "...";

    // ڕێکخستنی کاتی ڕاستەقینەی ڕۆژ بۆ سەر شاشەکە
    const today = new Date();
    const formattedDate = today.getFullYear() + '/' + (today.getMonth() + 1) + '/' + today.getDate();
    document.getElementById('pdf-date').innerText = "Date: " + formattedDate;

    // چارەسەری بارکردنی وێنەکان بەبێ کێشە
    document.getElementById('file-input').addEventListener('change', function(e) {
        const files = e.target.files;
        if(files.length > 0) {
            // وەرگرتنی ناوی نەخۆش لە ناوی یەکەم مەلەفەوە
            currentPatientName = files[0].name.split('.')[0];
            document.getElementById('pdf-patient').innerText = "Patient Name: " + currentPatientName;
        }
        
        for (let file of files) {
            const reader = new FileReader();
            reader.onload = function(event) {
                imagesData.push(event.target.result);
                
                // دروستکردنی کارت بۆ وێنەکە لەسەر شاشە
                const div = document.createElement('div');
                div.className = 'img-box';
                div.innerHTML = `<img src="${event.target.result}">`;
                document.getElementById('image-grid').appendChild(div);
            };
            reader.readAsDataURL(file);
        }
    });

    async function generatePDF() {
        if (imagesData.length === 0) return alert("تکایە سەرەتا وێنە بار بکە");
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        
        // وەرگرتنی ڕێکەوتی تەمەنی ئەو چرکەیەی PDF دابەزێنرێت
        const now = new Date();
        const liveDate = now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate();

        function drawHeader(pageDoc) {
            pageDoc.setFillColor(0, 0, 0);
            pageDoc.rect(0, 0, 210, 297, 'F');
            pageDoc.setTextColor(33, 150, 243);
            pageDoc.setFontSize(22);
            pageDoc.text("عيادة باوابي", 105, 35, { align: "center" });
            pageDoc.setTextColor(200);
            pageDoc.setFontSize(10);
            pageDoc.text("لاشعة الاسنان والوجه والفكين", 105, 42, { align: "center" });
            pageDoc.setTextColor(150);
            pageDoc.text(`Date: ${liveDate}`, 15, 20);
            pageDoc.text(`Patient Name: ${currentPatientName}`, 195, 20, { align: "right" });
            pageDoc.setDrawColor(40, 40, 40);
            pageDoc.line(10, 25, 200, 25);
        }

        drawHeader(doc);
        
        let yPos = 55;
        let xPos = 12;

        for (let i = 0; i < imagesData.length; i++) {
            // سێ وێنەی یەکەم بە گەورەیی لە یەک ڕیزدا
            if (i < 3) {
                doc.addImage(imagesData[i], 'JPEG', xPos, yPos, 58, 48);
                xPos += 63;
                if (i === 2) { 
                    yPos += 55; 
                    xPos = 12; 
                }
            } 
            // وێنەکانی تر بە قەبارەی گونجاو (چوار دانە لە ڕیزێکدا)
            else {
                let imgWidth = 43;
                let imgHeight = 35;
                let spacing = 5;

                // دروستکردنی پەڕەی نوێ تەنها کاتێک کە پەڕەکە بە ڕاستی پڕ بێتەوە
                if (yPos > 250) {
                    doc.addPage();
                    drawHeader(doc);
                    yPos = 55;
                    xPos = 12;
                }

                doc.addImage(imagesData[i], 'JPEG', xPos, yPos, imgWidth, imgHeight);
                xPos += imgWidth + spacing;
                
                // ڕێکخستنی دابەزین بۆ ڕیزی نوێ دوای هەر ٤ وێنەیەک
                if ((i - 2) % 4 === 0) {
                    xPos = 12;
                    yPos += imgHeight + spacing;
                }
            }
        }
        
        doc.setFontSize(8);
        doc.setTextColor(80);
        doc.text("Developed by: Mohammed Ezzadin", 105, 288, { align: "center" });
        
        doc.save(`${currentPatientName}_Bawayi_Report.pdf`);
    }
</script>
</body>
</html>
