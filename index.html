<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bawayi Dental Clinic</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { 
            background-color: #aae7ff; 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            color: #333333;
        }
        
        .top-nav { width: 100%; max-width: 850px; display: flex; justify-content: flex-start; margin-bottom: 15px; }
        
        .refresh-btn { 
            background-color: #ffeb3b; 
            color: black; 
            border: 1px solid #fbc02d; 
            padding: 8px 20px; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 13px; 
        }

        .report-paper { 
            width: 100%; 
            max-width: 850px; 
            background-color: #ffffff; 
            color: #222222; 
            padding: 50px 40px; 
            box-sizing: border-box; 
            position: relative; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.1);
        }

        .main-title { text-align: center; margin-bottom: 25px; margin-top: 10px; }
        .main-title h1 { color: #2196f3; margin: 0; font-size: 36px; font-weight: bold; }
        .main-title p { color: #666666; font-size: 16px; margin: 8px 0 0 0; font-weight: 500; }

        .header-info { 
            display: flex; 
            justify-content: space-between; 
            font-size: 16px; 
            color: #555555; 
            border-bottom: 3px solid #2196f3; 
            padding-bottom: 12px; 
            margin-bottom: 35px; 
            font-weight: bold;
        }

        .action-area { display: flex; justify-content: center; gap: 20px; margin: 20px 0 35px 0; }
        
        .btn { 
            padding: 15px 35px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            border: none; 
            color: white; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            text-align: center;
        }
        .btn-red { background-color: #e53935; }
        .btn-green { background-color: #4caf50; }

        #image-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 25px; }
        
        .img-box { 
            border: 1px solid #cccccc; 
            background: #fafafa; 
            aspect-ratio: 4/3; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            border-radius: 4px; 
            position: relative;
        }
        /* Keep full original ratio on screen preview */
        .img-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .img-number {
            position: absolute;
            top: 4px;
            left: 4px;
            background-color: #2196f3;
            color: white;
            padding: 1px 5px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            z-index: 10;
        }

        .footer-credit { text-align: center; font-size: 11px; color: #aaaaaa; margin-top: 60px; border-top: 1px solid #eeeeee; padding-top: 15px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="refresh-btn" onclick="window.location.reload()">Refresh Page</button>
    </div>

    <div class="report-paper">
        <div class="main-title">
            <h1>Bawayi Dental Clinic</h1>
            <p>Dental and Maxillofacial Radiology</p>
        </div>

        <div class="header-info">
            <div id="pdf-date">Date: --/--/----</div>
            <div id="pdf-patient">Patient Name: ...</div>
        </div>

        <div class="action-area">
            <label for="file-input" class="btn btn-red">Upload PDF X-Ray</label>
            <input type="file" id="file-input" accept=".pdf,image/*" multiple>
            <button class="btn btn-green" onclick="generatePDF()">Generate PDF</button>
        </div>

        <div id="image-grid"></div>

        <div class="footer-credit">Developed by: Mohammed Ezzadin</div>
    </div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let imagesData = [];
    let currentPatientName = "...";

    const today = new Date();
    const formattedDate = today.getFullYear() + '/' + (today.getMonth() + 1) + '/' + today.getDate();
    document.getElementById('pdf-date').innerText = "Date: " + formattedDate;

    document.getElementById('file-input').addEventListener('change', async function(e) {
        const files = e.target.files;
        if (files.length === 0) return;

        currentPatientName = files[0].name.split('.')[0];
        document.getElementById('pdf-patient').innerText = "Patient Name: " + currentPatientName;

        let tempImages = [];

        for (let file of files) {
            if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
                const fileReader = new FileReader();
                const pdfPromise = new Promise((resolve) => {
                    fileReader.onload = async function() {
                        const typedarray = new Uint8Array(this.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const viewport = page.getViewport({ scale: 3.5 }); // High-res render
                            
                            const canvas = document.createElement('canvas');
                            const context = canvas.getContext('2d');
                            canvas.height = viewport.height;
                            canvas.width = viewport.width;
                            
                            await page.render({ canvasContext: context, viewport: viewport }).promise;
                            
                            tempImages.push({
                                src: canvas.toDataURL('image/jpeg', 1.0),
                                ratio: canvas.width / canvas.height,
                                origWidth: canvas.width,
                                origHeight: canvas.height
                            });
                        }
                        resolve();
                    };
                });
                fileReader.readAsArrayBuffer(file);
                await pdfPromise;
            } else {
                const reader = new FileReader();
                const imgPromise = new Promise((resolve) => {
                    reader.onload = function(event) {
                        const img = new Image();
                        img.onload = function() {
                            tempImages.push({
                                src: event.target.result,
                                ratio: img.width / img.height,
                                origWidth: img.width,
                                origHeight: img.height
                            });
                            resolve();
                        };
                        img.src = event.target.result;
                    };
                });
                reader.readAsDataURL(file);
                await imgPromise;
            }
        }

        // Smart sorting: Panorama views always pushed to the top
        tempImages.sort((a, b) => b.ratio - a.ratio);
        imagesData = tempImages;

        const grid = document.getElementById('image-grid');
        grid.innerHTML = "";
        imagesData.forEach((imgObj, index) => {
            const div = document.createElement('div');
            div.className = 'img-box';
            div.innerHTML = `<span class="img-number">${index + 1}</span><img src="${imgObj.src}">`;
            grid.appendChild(div);
        });
    });

    function createHeaderImage(dateStr, patientStr) {
        const canvas = document.createElement('canvas');
        canvas.width = 1600; 
        canvas.height = 360; 
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#2196f3';
        ctx.font = 'bold 62px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Bawayi Dental Clinic', 800, 110);
        
        ctx.fillStyle = '#666666';
        ctx.font = '500 28px Arial, sans-serif';
        ctx.fillText('Dental and Maxillofacial Radiology', 800, 165);
        
        ctx.fillStyle = '#444444';
        ctx.font = 'bold 28px Arial, sans-serif';
        
        ctx.textAlign = 'left';
        ctx.fillText('Date: ' + dateStr, 60, 255);
        
        ctx.textAlign = 'right';
        ctx.fillText('Patient Name: ' + patientStr, 1540, 255);
        
        ctx.strokeStyle = '#2196f3';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(40, 295);
        ctx.lineTo(1560, 295);
        ctx.stroke();
        
        return canvas.toDataURL('image/jpeg', 1.0);
    }

    async function generatePDF() {
        if (imagesData.length === 0) return alert("Please upload X-Ray files first.");
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        
        const now = new Date();
        const liveDate = now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate();

        const headerImgBase64 = createHeaderImage(liveDate, currentPatientName);

        function drawHeader(pageDoc) {
            pageDoc.setFillColor(255, 255, 255);
            pageDoc.rect(0, 0, 210, 297, 'F');
            pageDoc.addImage(headerImgBase64, 'JPEG', 0, 5, 210, 47);
        }

        drawHeader(doc);
        
        let yPos = 56;
        let xPos = 12;

        for (let i = 0; i < imagesData.length; i++) {
            const currentImg = imagesData[i];
            
            if (i < 3) {
                // تەرخانکردنی چوارگۆشەی سەرەکی بۆ ٣ وێنە گەورەکە (ماکسیمم تا پانی ٥٨ و درێژی ٤٤)
                let maxWidth = 58;
                let maxHeight = 44;
                let finalWidth = maxWidth;
                let finalHeight = maxWidth / currentImg.ratio;

                if (finalHeight > maxHeight) {
                    finalHeight = maxHeight;
                    finalWidth = maxHeight * currentImg.ratio;
                }

                // سێنتەرکردنی وێنەکە لە ناو ناوچەی تەرخانکراوی خۆی بۆ جوانکاری
                let xOffset = xPos + (maxWidth - finalWidth) / 2;
                let yOffset = yPos + (maxHeight - finalHeight) / 2;

                doc.addImage(currentImg.src, 'JPEG', xOffset, yOffset, finalWidth, finalHeight, undefined, 'FAST');
                
                // کێشانی نیشانەی ژمارەی وێنە لە گۆشەی ڕاستەقینەی ناوچەکە
                doc.setFillColor(33, 150, 243);
                doc.rect(xPos + 0.8, yPos + 0.8, 5.5, 4.5, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(8.5);
                doc.text((i + 1).toString(), xPos + 2, yPos + 4);

                xPos += 63;
                if (i === 2) { 
                    yPos += 50; 
                    xPos = 12; 
                }
            } 
            else {
                // تەرخانکردنی چوارگۆشە بۆ ڕێزەکانی خوارەوە (ماکسیمم پانی ٤٣ و درێژی ٣٣)
                let maxWidth = 43;
                let maxHeight = 33;
                let spacing = 5;
                
                let finalWidth = maxWidth;
                let finalHeight = maxWidth / currentImg.ratio;

                if (finalHeight > maxHeight) {
                    finalHeight = maxHeight;
                    finalWidth = maxHeight * currentImg.ratio;
                }

                if (yPos > 255) {
                    doc.addPage();
                    drawHeader(doc);
                    yPos = 56;
                    xPos = 12;
                }

                let xOffset = xPos + (maxWidth - finalWidth) / 2;
                let yOffset = yPos + (maxHeight - finalHeight) / 2;

                doc.addImage(currentImg.src, 'JPEG', xOffset, yOffset, finalWidth, finalHeight, undefined, 'FAST');
                
                doc.setFillColor(33, 150, 243);
                doc.rect(xPos + 0.8, yPos + 0.8, 5.5, 4.5, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(8);
                doc.text((i + 1).toString(), xPos + 2, yPos + 4);

                xPos += maxWidth + spacing;
                
                if ((i - 2) % 4 === 0) {
                    xPos = 12;
                    yPos += maxHeight + spacing;
                }
            }
        }
        
        doc.setFontSize(9);
        doc.setTextColor(160);
        doc.text("Developed by: Mohammed Ezzadin", 105, 291, { align: "center" });
        
        doc.save(`${currentPatientName}_Bawayi_Report.pdf`);
    }
</script>
</body>
</html>
